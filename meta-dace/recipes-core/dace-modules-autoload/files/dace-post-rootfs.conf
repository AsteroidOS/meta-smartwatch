# --- slate CROWN/RSB ---
# slatersb_rpmsg + slate_rsb: the slate-rsb-ctl channel does NOT exist until the
# MCU starts (dace-slate-mcu, much later). If slatersb_rpmsg probes with
# slate_rsb absent, rsb_ops.glink_channel_state is NULL -> call to NULL ->
# oops -> panic (panic_on_oops=1) -> reset. Loaded here with the MCU stopped,
# the probe happens later with rsb_ops already initialized. slate_rsb has no
# MODULE_DEVICE_TABLE(of): without an OF alias, udev never autoloads it (stock
# lists it by hand in vendor_dlkm/modules.load). slatersb_rpmsg is in the
# blacklist so udev cannot autoload it; the explicit modprobe of
# dace-modules-load.sh ignores the blacklist (same case as wlan). BT does not
# use these .ko's.
slatersb_rpmsg
slate_rsb
