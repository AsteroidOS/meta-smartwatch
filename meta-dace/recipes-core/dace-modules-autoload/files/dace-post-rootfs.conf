# --- slate CROWN/RSB (2026-09-22) ---
# slatersb_rpmsg + slate_rsb: the slate-rsb-ctl channel does NOT exist until the
# MCU starts (dace-slate-mcu, much later). If slatersb_rpmsg probes with
# slate_rsb absent, rsb_ops.glink_channel_state is NULL -> call to NULL ->
# oops -> panic (panic_on_oops=1) -> reset: this is the crash documented when
# "loading both .ko's with the MCU running" (AGENTS §6). Loaded HERE, with the
# MCU stopped, the probe happens later with rsb_ops already initialized -> safe.
# slate_rsb has no MODULE_DEVICE_TABLE(of): without an OF alias, udev NEVER
# autoloads it (stock lists it by hand in vendor_dlkm/modules.load L32-33).
# slatersb_rpmsg is in the blacklist so udev cannot autoload it ON ITS OWN (this
# script's failure case): the explicit modprobe of dace-modules-load.sh ignores
# it (same case as wlan). BT does not use these .ko's.
slatersb_rpmsg
slate_rsb
