# Modules whose .ko's live in the rootfs (/lib/modules/<KREL>/vendor/) and
# therefore CANNOT go in the initramfs (modules.load.dace): systemd loads them
# here, after switch_root.
#
# HISTORY: this list was commented out since 2026-09-13 because the chain took
# the SoC down to EDL at ~10 s. It was discovered that the culprit was NOT
# systemd-modules-load but **udev**, which loaded the .ko's by modalias during
# its coldplug; that is why they are now all in
# /etc/modprobe.d/00-dace-vendor-blacklist.conf (that blocks udev). With the
# blacklist in place the list can be enabled: the explicit `modprobe` of
# systemd-modules-load DOES load the module (the blacklist only ignores aliases).
#
# ✅ TESTED LIVE (2026-09-18): the whole WLAN chain loads WITHOUT crashing:
#     cnss_plat: CNSS Platform IPC QMI Service is started
#     icnss2 c800000.qcom,icnss: Platform driver probed successfully
#     wlan: Loading driver v2.0.9.17Y ... wlan_hdd_state wlan major(491) initialized
# NOTE: `google_wlan_mac` fails with "Unable to locate /chosen/config in
# device-tree": Google's bootloader fills /chosen/config with the provisioned MAC
# (property `wlan_mac1`) and the Mobvoi ABL does NOT -> without that node
# qca_cld3_wlan is left without a MAC and wlan0 does not appear.

# --- WLAN (qcacld-3.0 + CNSS platform glue) ---
wlan
icnss2
cnss_nl
cnss_plat_ipc_qmi_svc
cnss_prealloc
