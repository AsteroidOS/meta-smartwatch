# The T5 touch (Zinitix) DOES work, but it is loaded SEPARATELY and AFTER the
# display HALs: with the driver built-in (or loaded by udev during coldplug at
# ~10 s) the Qualcomm composer-service dies with SIGSEGV (~0.2 s after starting,
# right after creating /dev/socket/pps) and the UI is left without a composer.
# dace-lxc-hal-start.sh loads the vendor chain (slate_events_bridge/
# slate_mobvoi_rpc/zinitix-i2c from /usr/lib/dace-vendor-modules) after starting
# allocator+composer. The mainline zinitix no longer exists in the kernel
# (=n in sw5100.fragment): the entry is kept for backwards compatibility.
blacklist zinitix

# CROWN: slatersb_rpmsg must only be loaded TOGETHER WITH slate_rsb and with the
# MCU stopped (dace-post-rootfs.conf / dace-slate-mcu.sh). If udev autoloaded it
# ON ITS OWN by the rpmsg:slate-rsb-ctl alias (channel the MCU opens when
# starting), its probe would call rsb_ops.glink_channel_state=NULL -> oops ->
# panic (panic_on_oops=1) -> reset. The EXPLICIT modprobe of the
# script ignores it (precedent: wlan, also blacklisted and loaded OK by the
# script). BT does not depend on this module: it cannot break Bluetooth.
blacklist slatersb_rpmsg
