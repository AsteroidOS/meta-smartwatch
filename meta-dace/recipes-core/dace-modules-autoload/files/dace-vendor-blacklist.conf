# dace: the vendor modules (.ko in /lib/modules/<krel>/vendor/) are loaded by
# udev by modalias during coldplug at ~10.6 s into the rootfs boot and the SoC
# resets to EDL right after (the last console line was from the crypto engine).
# The old rootfs did NOT have them (empty vendor/: linux-dace-modules was not
# installed) and lasted hours without a problem. Until the culprit is
# identified all of them are blocked: 'blacklist' only affects autoload by
# alias, so what is needed can still be loaded by hand with modprobe.
#
# Generated with:
#   for f in /lib/modules/*/vendor/*.ko; do echo "blacklist $(basename $f .ko)"; done
# (76 modules; removing lines here is how the culprit is bisected.)
blacklist adsp_loader_dlkm
blacklist audio_cc_ipc_dlkm
blacklist audio_pkt_dlkm
blacklist audio_prm_dlkm
blacklist audpkt_ion_dlkm
blacklist besbev_dlkm
blacklist besbev-slave_dlkm
blacklist bolero_cdc_dlkm
blacklist bt_fm_slim
