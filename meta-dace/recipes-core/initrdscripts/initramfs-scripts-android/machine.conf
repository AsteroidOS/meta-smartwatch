# TicWatch Pro 5 eMMC partitions (real by-name map, from sysfs uevent):
#   mmcblk0p7  = super (Wear OS dynamic)
#   mmcblk0p56 = swap
#   mmcblk0p62 = userdata (F2FS, 20 GiB) <- the AsteroidOS rootfs lives here
#   (/sdcard/asteroidos.ext4, pushed over adb; init loop-mounts it and switch_roots)
sdcard_partition=mmcblk0p62
sdcard_fstype=f2fs
system_partition=mapper/system
