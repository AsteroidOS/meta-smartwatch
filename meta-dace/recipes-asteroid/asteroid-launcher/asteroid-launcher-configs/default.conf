EGL_PLATFORM=hwcomposer
QT_QPA_PLATFORM=hwcomposer
# The T5 (Wear OS, Qualcomm) does NOT have a passthrough hwcomposer module: on
# A13 the composer is a SERVICE. Without this variable the QPA plugin calls
# hw_get_module("hwcomposer") and the launcher hangs with the module open (it
# never gets to create the Wayland display). With QT_QPA_FORCE_HWC2=1 the plugin
# uses the HWC2 backend directly (which talks to the composer service) and it
# works: verified on the watch -> /run/user/1000/wayland-0 appears and the CRTC
# card0-DSI-1 becomes 'enabled' (the UI is painted).
QT_QPA_FORCE_HWC2=1

LIPSTICK_OPTIONS="-plugin evdevtouch:/dev/input/event3 -plugin evdevmouse:/dev/input/event2 -plugin evdevkeyboard:/dev/input/event2:keymap=/usr/share/qt6/keymaps/keys.qmap -plugin evdevkeyboard:/dev/input/event0:keymap=/usr/share/qt6/keymaps/keys.qmap"
# NOTE on keymaps: the file is generated with kmap2qmap and installed into
# /usr/share/qt6/keymaps/keys.qmap (asteroid-launcher-configs_git.bb). The
# previous path pointed to /usr/share/qt5/... (does NOT exist) -> Qt fell back
# to the default keymap, which does NOT have KEY_MENU (139) or the volume codes:
# the crown pushbutton and the volume buttons were DISCARDED in Qt. keys.kmap
# maps 139 -> MenuKB (Qt::Key_MenuKB), 114/115 -> VolumeDown/Up; the keymap is
# also set on event2 (slate-spi) so that volume works.
# event2: the bridge reports the crown as REL_WHEEL (consumed by evdevmouse) and
# the volumes as EV_KEY (consumed by evdevkeyboard).
# evdevmouse on event2: the slate bridge reports the CROWN as REL_WHEEL on that
# input (EV_KEY|EV_REL). evdevkeyboard only consumes EV_KEY, so the wheel was
# lost. evdevmouse (generic Qt plugin; same pattern as hoki/narwhal/ray)
# converts REL_WHEEL into QWheelEvent, which lipstick forwards
# (LipstickCompositorWindow::wheelEvent) and the launcher consumes in its
# WheelHandler (005-speed-dial.qml). Neither of the two does EVIOCGRAB, which is
# why they can read the SAME event2 at the same time.
# NOTE on the event mapping (deterministic):
#   event0 = gpio-keys (side button) · event1 = qpnp_pon
#   event2 = slate-spi (vendor bridge; crown REL_WHEEL + keys)
#   event3 = zinitix_ts (touch, vendor driver loaded in dace-lxc-hal-start.sh)
# The vendor bridge is loaded BEFORE zinitix (zinitix needs its symbols), which
# is why the touch falls on event3 and the crown on event2.
QT_ENABLE_GLYPH_CACHE_WORKAROUND=true
QT_IM_MODULE=qtvirtualkeyboard

# NOTE: /vendor/lib/egl is ESSENTIAL -- the EGL subdrivers
# (eglSubDriverAndroid.so) live there, not in /vendor/lib. Without that path the
# launcher spat out 'library "eglSubDriverAndroid.so" not found' and the
# compositor never got to create the Wayland display (unit in 'activating' until
# the 90 s timeout). Verified on the watch: with the path, the error disappears.
#
# Point libhybris's Android linker at this device's Android-13 /system libs
# (LXC container rootfs), the A13 vendor (/vendor -> /android/vendor), the
# pie64 hal-droid tree (where libui_compat_layer.so lives), and the runtime
# apex bionic dir (for libdl_android.so, a dangling /apex symlink in
# /system/lib).
HYBRIS_LD_LIBRARY_PATH=/var/lib/lxc/android/rootfs/system/lib:/vendor/lib:/vendor/lib/egl:/usr/libexec/hal-droid/system/lib:/var/lib/lxc/android/rootfs/apex/com.android.runtime/lib/bionic

# Strip UBWC-triggering bits (HW_COMPOSER, PRIVATE_ALLOC_UBWC,
# PRIVATE_ALLOC_UBWC_PI) from HWComposerNativeWindow's buffer usage so the
# allocator returns linear (modifier=0) buffers. Monaco's only
# launcher-eligible SDE plane is plane 70 (DMA pipe), which can't scan UBWC;
# without this, drmModeAtomicCommit fails -EINVAL and the launcher loops on
# `prepare: validate failed`. Read by the dace-only libhybris patch
# (libhybris-dace-disable-ubwc-usage).
HYBRIS_HWC_DISABLE_COMPOSER_USAGE=1
