LIPSTICK_OPTIONS="-plugin evdevkeyboard:/dev/input/event2:keymap=/usr/share/qt6/keymaps/keys.qmap -plugin evdevkeyboard:/dev/input/event0:keymap=/usr/share/qt6/keymaps/keys.qmap"
# Qt's udev device discovery fails inside asteroid-launcher on rubyfish
# ("Failed to scan devices"), so the evdevtouch plugin from the service finds
# no touchscreen. Name the bt541 controller instead; evdevtouch reads this
# variable before it falls back to discovery.
QT_QPA_EVDEV_TOUCHSCREEN_PARAMETERS=/dev/input/by-path/platform-78b8000.i2c-event
QPA_HWC2_FORCE_DOZE_UPDATE=1
QPA_HWC_FORCE_GLES=1
QT_OPENGL_NO_BGRA=1
