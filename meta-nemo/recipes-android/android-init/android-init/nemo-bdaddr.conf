# Seed the Bluetooth address from the device's own factory record.
#
# bluetooth_rfkill_event reads its address from the file named by the config
# file's [General] bdaddr key, defaulting to the path below. It does not only
# read that file: load_bd_add() calls save_bd_add() whenever the file cannot be
# opened or fails the format check, so whatever path it is given is writable
# state, not a read-only source. Its unit also has no ordering against the
# /persist mount, so a boot that raced the mount would overwrite the factory
# record permanently.
#
# So the daemon keeps its own file and this copies the factory value into it
# once, on a boot where /persist is mounted. systemd-tmpfiles-setup runs after
# local-fs.target, so the mount is up by then. C copies only when the
# destination is absent, so a later address change by the daemon is preserved
# and the factory partition is never written.
C /var/lib/bluetooth-rfkill-event/bluetooth_address - - - - /persist/bdaddr.txt
