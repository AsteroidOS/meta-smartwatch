# Modules whose .ko files live on the rootfs (/lib/modules/<KREL>/vendor/)
# and therefore cannot be loaded from the VKB initramfs modules.load.aurora.
# Systemd's systemd-modules-load.service walks this file at boot, after the
# rootfs is mounted -- modprobe then resolves dependencies from modules.dep.
# Order is informational; modprobe handles dep resolution.

# --- Qualcomm application-processor and cluster low-power policy ---
# qcom_lpm registers the qcom-cpu-lpm governor and binds the cluster-device
# power domain. Without it the generic menu governor only selects CPU-local
# PSCI states and Aurora records no APSS low-power residency. Its
# sleep_disabled parameter is left at the module default (1): with cluster
# sleep enabled every suspend flushes ~15 dirty RPM sleep-set votes and the
# RPM's acknowledgement IPC wakes the AP ~8 ms later, so the watch "suspends"
# 5-6 times a second and sleeps 5 % of the time (~50 mA); with the default the
# same kernel sleeps 92-94 % of the time in multi-ten-second stretches
# (measured 2026-10-01). Flip /sys/devices/system/cpu/qcom_lpm/parameters/
# sleep_disabled by hand for experiments.
qcom_lpm

# Safe, read-only RPM/subsystem residency counters used to verify APSS, modem,
# ADSP and system low-power entry. Do not confuse these with rpm_master_stats,
# whose unsupported master SMEM reads wedge Monaco.
soc_sleep_stats
subsystem_sleep_stats

# --- WLAN (qcacld-3.0 + CNSS platform glue) ---
# wlan.ko is the qcacld driver. icnss2 is the integrated cnss subsystem that
# brokers WLFW QMI between the driver and the modem firmware. The cnss_*
# helpers are utility modules.
wlan
icnss2
cnss_nl
cnss_plat_ipc_qmi_svc
cnss_prealloc
cnss_utils
wlan_firmware_service
google_wlan_mac

