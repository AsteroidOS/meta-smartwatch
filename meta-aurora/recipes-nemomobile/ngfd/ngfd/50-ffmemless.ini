# Aurora vibrates through cs40l26's FF_PERIODIC sine (BUZZGEN). Events not
# listed in supported_effects play ffmemless's periodic default effect, with
# the duration set by haptic.duration in events.d.
#
# cache_effects = true makes ffmemless re-upload the effect on every play so
# each event gets its own replay.length. Without it the effect is uploaded
# once at init with the default 240 ms and every event feels the same.
#
# alarm (haptic.effect = clock) and ringtone repeat until the client stops
# them: 1 s on, 0.5 s off, like droid-vibrator's sequences on hybris watches.
# cs40l26 plays an effect once per trigger and ignores replay.delay; the
# _DELAY here only sets the pause between the triggers ffmemless sends.
# BUZZGEN caps a single effect at 1020 ms.
[ffmemless]

system_effects_env = NGF_FFMEMLESS_SETTINGS

cache_effects = true

supported_effects = clock;ringtone

clock_TYPE = periodic
clock_DURATION = 1000
clock_DELAY = 500
clock_PERIOD = 50
clock_MAGNITUDE = 27000

ringtone_TYPE = periodic
ringtone_DURATION = 1000
ringtone_DELAY = 500
ringtone_PERIOD = 50
ringtone_MAGNITUDE = 27000
