# geoclue-hybris settings for the TicWatch E/S.
[xtra]
# Once its Xtra interface is initialised, MediaTek's GPS HAL downloads EPO
# data from sproutepo.mediatek.com at every GPS start. That server no longer
# serves the file, and the HAL then replaces good EPO data with the error
# page. mtk-gps-epo provides the EPO data instead.
XTRA_DISABLED=true
